name: Update Benchmarks

on:
  pull_request:
    paths:
      - 'src/benchmarks/**'
      - 'src/scripts/update-readme.ts'
      - 'package.json'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: latest

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Get changed benchmark files
        id: changed-files
        run: |
          # Get the list of changed files in src/benchmarks/ compared to main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- 'src/benchmarks/*.ts' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No benchmark files changed"
            echo "suites=" >> $GITHUB_OUTPUT
          else
            SUITES=$(echo "$CHANGED_FILES" | sed 's|src/benchmarks/||g' | sed 's|\.ts$||g' | tr '\n' ' ')
            echo "Changed suites: $SUITES"
            echo "suites=$SUITES" >> $GITHUB_OUTPUT
          fi

      - name: Update benchmark results
        if: steps.changed-files.outputs.suites != ''
        run: |
          npm run update-readme -- ${{ steps.changed-files.outputs.suites }}

      - name: Commit and push changes
        if: steps.changed-files.outputs.suites != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md results/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update benchmark results [skip ci]"
            git push
          fi
