name: Update Benchmarks

on:
  pull_request:
    paths:
      - 'src/benchmarks/**'
      - 'src/scripts/update-readme.ts'
      - 'src/run-suite.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: latest

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Determine which benchmarks to run
        id: changed-files
        run: |
          RESULT=$(./scripts/get-changed-suites.sh)

          if [ "$RESULT" = "ALL" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "suites=" >> $GITHUB_OUTPUT
          elif [ -z "$RESULT" ]; then
            echo "run_all=false" >> $GITHUB_OUTPUT
            echo "suites=" >> $GITHUB_OUTPUT
          else
            echo "run_all=false" >> $GITHUB_OUTPUT
            echo "suites=$RESULT" >> $GITHUB_OUTPUT
          fi

      - name: Update benchmark results
        if: steps.changed-files.outputs.run_all == 'true' || steps.changed-files.outputs.suites != ''
        run: |
          if [ "${{ steps.changed-files.outputs.run_all }}" = "true" ]; then
            echo "Running all benchmarks"
            npm run update-readme
          else
            echo "Running specific benchmarks: ${{ steps.changed-files.outputs.suites }}"
            npm run update-readme -- ${{ steps.changed-files.outputs.suites }}
          fi

      - name: Commit and push changes
        if: steps.changed-files.outputs.run_all == 'true' || steps.changed-files.outputs.suites != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md results/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update benchmark results [skip ci]"
            git push
          fi
